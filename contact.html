<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Zarif Latif</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <button id="theme-toggle" class="theme-toggle-btn" aria-label="Toggle Theme">🌙</button>
    <header>
        <h1>Get in Touch</h1>
        <p>Feel free to reach out for research collaborations or project inquiries</p>
        <nav>
            <ul>
                <li><a href="index.html">Back to Home</a></li>
            </ul>
        </nav>
    </header>

    <section class="contact-container">
        <h2>Send a Message</h2>
        <form action="mailto:zarif.latif.biz@gmail.com" method="post" enctype="text/plain" class="contact-form">
            <div class="form-group">
                <label for="name">Your Name</label>
                <input type="text" id="name" name="name" required placeholder="Enter your name">
            </div>

            <div class="form-group">
                <label for="email">Your Email</label>
                <input type="email" id="email" name="email" required placeholder="Enter your email">
            </div>

            <div class="form-group">
                <label for="message">Message</label>
                <textarea id="message" name="message" rows="6" required
                    placeholder="Write your message here..."></textarea>
            </div>

            <button type="submit" class="submit-btn">Send Email</button>
        </form>
    </section>

    <footer>
        <p>&copy; 2026 Zarif Latif. All rights reserved.</p>
        <p><a href="index.html">Return to Homepage</a></p>
    </footer>
    <script>
        const toggleBtn = document.getElementById("theme-toggle");
        if (localStorage.getItem("theme") === "dark") {
            document.body.classList.add("dark");
            toggleBtn.textContent = "☀️";
        }

        toggleBtn.addEventListener("click", () => {
            document.body.classList.toggle("dark");
            if (document.body.classList.contains("dark")) {
                localStorage.setItem("theme", "dark");
                toggleBtn.textContent = "☀️";
            } else {
                localStorage.setItem("theme", "light");
                toggleBtn.textContent = "🌙";
            }
        });
    </script>

</body>

</html>
